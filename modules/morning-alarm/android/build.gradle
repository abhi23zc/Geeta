plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.morningalarm'
version = '1.0.0'

android {
  namespace "expo.modules.morningalarm"

  sourceSets {
    main {
      // Package the existing Aru wake animation without duplicating the asset.
      assets.srcDir "${rootProject.projectDir}/../assets/aru/video/transparent-optimized"
    }
  }

  compileOptions {
    coreLibraryDesugaringEnabled true
  }

  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.appcompat:appcompat:1.7.1'
  testImplementation 'junit:junit:4.13.2'
}
